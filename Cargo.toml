[package]
name = "kemdara"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform cryptography experimentation, verification, and benchmarking workbench"
license = "MIT OR Apache-2.0"
authors = ["Lewis John Villamor"]
repository = "https://github.com/lewisjohnvillamor/Kemdara"
readme = "README.md"
keywords = ["cryptography", "post-quantum", "benchmark", "ecdh", "ml-kem"]
categories = ["cryptography", "development-tools"]

[dependencies]
aes-gcm = "0.11.1"
blake2 = "0.11.0"
blake3 = "1.8.2"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
eframe = "0.36.1"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "getrandom"] }
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
rand = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
slh-dsa = "0.2.0-rc.5"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
crrl = { version = "0.9.0", default-features = false, features = ["std", "x448"] }

[profile.release]
lto = "thin"
codegen-units = 1
