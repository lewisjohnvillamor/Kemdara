[package]
name = "kemdara"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform cryptography experimentation, verification, and benchmarking workbench"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = "0.36.1"
getrandom = "0.4.3"
hex = "0.4.3"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
p256 = { version = "0.14.0", features = ["ecdh", "getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.39.6", default-features = true }
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
crrl = { version = "0.9.0", default-features = false, features = ["std", "x448"] }

[profile.release]
lto = "thin"
codegen-units = 1
